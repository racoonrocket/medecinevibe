<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrice Spécialités × Villes — EDN</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        th {
            position: sticky;
            top: 0;
            background: #f9fafb;
            z-index: 10;
        }

        th:first-child,
        td:first-child {
            position: sticky;
            left: 0;
            background: #f3f4f6;
            z-index: 20;
        }
    </style>
</head>
<!-- NAVBAR FIXE PREMIUM -->
<header class="fixed top-0 left-0 w-full bg-white shadow-md z-50">
    <nav class="max-w-6xl mx-auto px-6 py-4 flex flex-wrap items-center gap-y-3">

        <!-- Logo + titre -->
        <div class="flex items-center gap-3 mr-auto">
            <img src="/logo512512.png" class="w-9 h-9 opacity-90">
            <span class="text-lg font-semibold text-gray-900 tracking-tight">MedecineVibe</span>
        </div>

        <!-- Liens -->
        <div class="flex items-center gap-6 text-sm font-medium w-full md:w-auto md:ml-auto">
            <a href="index.html" class="text-gray-700 hover:text-black transition">
                Home
            </a>
            <a href="methods.html" class="text-gray-700 hover:text-black transition">
                Méthodologie
            </a>
        </div>

    </nav>
</header>

<body class="p-6 bg-gray-50 pt-24 md:pt-20">
    <div class="max-w-6xl mx-auto">

        <h1 id="title" class="text-2xl font-semibold text-center mb-6">
            Matrice Spécialités × Villes
        </h1>

        <div class="bg-white border border-gray-200 p-6 rounded-xl shadow-sm mb-6">

            <label class="text-sm text-gray-600">Année</label>
            <select id="annee" class="w-full px-3 py-2 border rounded-lg mt-2">
                <option value="2025">2025</option>
                <option value="2024">2024</option>
                <option value="2023">2023</option>
                <option value="2022">2022</option>
            </select>

            <label class="text-sm text-gray-600 mt-4 block">Votre rang</label>
            <input id="userRank" type="number" placeholder="1500" class="w-full px-3 py-2 border rounded-lg mt-2">

            <label class="text-sm text-gray-600 mt-4 block">Total élèves</label>
            <input id="total" type="number" placeholder="11800" class="w-full px-3 py-2 border rounded-lg mt-2">

            <div class="mt-6">
                <label class="text-sm text-gray-600 block mb-2">Mode</label>
                <div class="flex gap-2">
                    <button type="button" data-mode="0"
                        class="mode-btn px-4 py-2 text-sm rounded-lg border border-gray-300 transition">
                        Brute
                    </button>
                    <button type="button" data-mode="1"
                        class="mode-btn px-4 py-2 text-sm rounded-lg border border-gray-300 transition">
                        Sans CESP
                    </button>
                    <button type="button" data-mode="2"
                        class="mode-btn px-4 py-2 text-sm rounded-lg border border-gray-300 transition">
                        Ajusté
                    </button>
                </div>
            </div>

            <button onclick="loadMatrix()" class="w-full bg-black text-white py-3 rounded-lg mt-4">
                Générer la matrice
            </button>
            <a href="index.html" class="btn-back">← Retour</a>
        </div>

        <div class="flex items-center gap-6 bg-white border border-gray-200 px-4 py-3 rounded-xl shadow-sm mb-6">
            <div class="flex items-center gap-2"><span class="text-xl">✅</span><span
                    class="text-sm text-gray-700">Au-dessus du dernier appelé</span></div>
            <div class="flex items-center gap-2"><span class="text-xl">⚠️</span><span
                    class="text-sm text-gray-700">Entre le premier et le dernier appelé</span></div>
            <div class="flex items-center gap-2"><span class="text-xl">❌</span><span class="text-sm text-gray-700">
                    Sous le dernier appelé</span></div>
        </div>

        <div id="matrix" class="overflow-x-auto overflow-y-auto max-h-[70vh]"></div>

    </div>

    <script>

        let currentMode = "brute";
        const modes = ["brute", "sans cesp", "ajuste"];

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {

                document.querySelectorAll('.mode-btn').forEach(b => {
                    b.classList.remove('bg-black', 'text-white', 'border-black');
                    b.classList.add('border-gray-300');
                });

                btn.classList.add('bg-black', 'text-white', 'border-black');
                currentMode = modes[parseInt(btn.dataset.mode)];
            });
        });

        document.querySelector('.mode-btn[data-mode="0"]').classList.add("bg-black", "text-white", "border-black");


        async function loadMatrix() {
            const annee = document.getElementById("annee").value;
            const userRank = parseInt(document.getElementById("userRank").value);
            const total = parseInt(document.getElementById("total").value) || 11800;

            if (!userRank) {
                alert("Veuillez entrer un rang");
                return;
            }

            const matrixDiv = document.getElementById("matrix");
            matrixDiv.innerHTML = `
                <div class="text-center">
                    <img src="santa.gif" class="mx-auto w-24 h-24 mb-2" alt="loading">
                    <p>Chargement…</p>
                </div>`;

            const resp = await fetch("/api/specialites");
            const data = await resp.json();

            const specs = data.specialites.sort();
            const villeSet = new Set();
            const matrix = {};

            const batchSize = 15;

            for (let i = 0; i < specs.length; i += batchSize) {
                const batch = specs.slice(i, i + batchSize);

                const responses = await Promise.all(
                    batch.map(spe =>
                        fetch(`/api/stats_bulk/${encodeURIComponent(spe)}?annee=${annee}&mode=${encodeURIComponent(currentMode)}`)
                            .then(r => r.ok ? r.json() : null)
                    )
                );

                responses.forEach((bulk, idx) => {
                    const spe = batch[idx];
                    if (!bulk) return;

                    matrix[spe] = {};

                    for (const entry of bulk.villes) {
                        const ville = entry.ville.toUpperCase();
                        villeSet.add(ville);

                        const minN = Math.round((entry.rang_min / 8957) * total);
                        const maxN = Math.round((entry.rang_max / 8957) * total);

                        let emoji = "❌";
                        if (userRank <= minN) emoji = "✅";
                        else if (userRank <= maxN) emoji = "⚠️";

                        // 🔥 STORE VALUES FOR TOOLTIP
                        matrix[spe][ville] = { emoji, minN, maxN };
                    }
                });
            }

            const villeList = [...villeSet].sort();

            let html = `<table class="min-w-full text-sm border-collapse">
                <thead><tr>
                    <th class="border px-3 py-2 bg-gray-100 text-left">Spécialité</th>`;

            villeList.forEach(v => {
                html += `<th class="border px-3 py-2 bg-gray-50 text-center">${v}</th>`;
            });

            html += `</tr></thead><tbody>`;

            for (const spe of specs) {
                html += `<tr>
                    <td class="border px-3 py-2 font-medium bg-gray-50">${spe}</td>`;

                villeList.forEach(v => {
                    const cell = matrix[spe]?.[v];

                    if (!cell) {
                        html += `<td class="border px-3 py-2 text-center">—</td>`;
                    } else {
                        html += `
        <td class="border px-3 py-2 text-center">
            <div class="relative group inline-block cursor-pointer select-none"
                 onclick="this.querySelector('.tip').classList.toggle('hidden')">

                ${cell.emoji}

                <!-- TOOLTIP -->
                <div class="tip hidden group-hover:block absolute -top-1 left-1/2 -translate-x-1/2
                            bg-gray-800 text-white text-xs px-2 py-1 rounded-lg whitespace-nowrap shadow-lg">
                    Min: ${cell.minN} • Max: ${cell.maxN}
                </div>
            </div>
        </td>`;
                    }
                });

                html += `</tr>`;
            }

            html += `</tbody></table>`;
            matrixDiv.innerHTML = html;
        }

    </script>

</body>

</html>
